worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100m;

    # Journal accès sans cookies / Authorization
    log_format course_safe '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout course_safe;

    upstream ctfd_upstream {
        server ctfd:8000;
    }

    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://ctfd_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
    }

    # Bloc HTTPS — activer quand TLS_CERT_PATH / TLS_KEY_PATH sont fournis
    # server {
    #     listen 443 ssl http2;
    #     server_name ctfd.cours.example.invalid;
