global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Instances challenge (plugin 0xfbad) : chal-u<user>-c<chal>-<ts>[-<svc>]
      - source_labels: [name]
        regex: "chal-u([0-9]+)-c([0-9]+)-.*"
        target_label: ctf_user
        replacement: "$1"
      - source_labels: [name]
        regex: "chal-u([0-9]+)-c([0-9]+)-.*"
        target_label: ctf_chal
        replacement: "$2"

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
