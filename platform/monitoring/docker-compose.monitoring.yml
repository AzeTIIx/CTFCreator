# Supervision VPS CTF — cAdvisor + node_exporter + Prometheus + Grafana
# Versions épinglées (jamais latest). Aucun port public : Grafana/Prometheus sur 127.0.0.1,
# accès via tunnel SSH (voir sshd/60-monitoring-tunnel.conf).
#
# NB sécurité : cAdvisor tourne en privileged avec /var/run monté (socket Docker) — c'est
# l'exigence amont pour lire les cgroups. Il est donc équivalent root sur l'hôte ; il n'expose
# aucun port hors du réseau "monitoring".

name: monitoring

services:
  cadvisor:
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:0.60.5}
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,ctf.stack_id
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --web.listen-address=:9090
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    depends_on:
      - cadvisor
      - node-exporter
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.3}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD requis (install.sh le génère)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ctf-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"

networks:
  monitoring:
    name: monitoring
    driver: bridge

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
  grafana_data:
    name: monitoring_grafana_data
