# Géré par monitoring/install.sh --ssh-tunnel
# Le durcissement global (50-course-ctfd-hardening.conf) met AllowTcpForwarding no.
# Exception limitée : forward local uniquement, vers Grafana/Prometheus sur loopback.
Match User __USERS__
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:3000 localhost:3000 127.0.0.1:9090 localhost:9090
